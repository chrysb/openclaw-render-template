services:
  - type: web
    runtime: docker
    name: DenchClaw
    region: frankfurt
    plan: pro
    healthCheckPath: /health
    envVars:
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: PORT
        value: 3000
      - key: ALPHACLAW_CLAW_RUNTIME
        value: denchclaw
      - key: ALPHACLAW_GATEWAY_PORT
        value: 19001
      - key: DENCHCLAW_DAEMONLESS
        value: 1
      - key: DENCHCLAW_WEB_PORT
        value: 3100
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 10
